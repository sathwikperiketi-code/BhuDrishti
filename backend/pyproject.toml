[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bhudrishti-backend"
version = "0.1.0"
description = "Backend foundation for the BhuDrishti AI land-record digitization prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "Pillow>=10.0,<12.0",
  "opencv-python-headless>=4.10,<5.0",
  "pytesseract>=0.3.13,<1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4.0"]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0", "pytest-cov>=5.0,<6.0"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
